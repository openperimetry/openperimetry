<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Safari ignores inline data-URI SVG favicons, so ship real files.
         .ico/.png are what Safari actually renders in the tab; the SVG is for
         Chrome/Firefox and apple-touch-icon covers iOS/macOS bookmarks. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Free visual field self-test — Goldmann kinetic perimetry at home. Track your peripheral vision over time." />
    <!-- theme-color is updated by the no-flash script below (and by theme.ts at
         runtime) to match the resolved theme; the default covers the no-JS case. -->
    <meta name="theme-color" content="#f4f7fb" />
    <!-- Resolve the saved theme preference to a concrete light|dark value and
         apply it before first paint, so a dark-mode user never sees a white flash.
         The theme-color meta above is already parsed, so we can sync it here too
         to avoid a wrong-colored mobile status bar before React mounts. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('vfc-theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = pref === 'dark' || (pref === 'system' && prefersDark);
          var t = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0b1220' : '#f4f7fb');
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Vite replaces HTML env placeholders at build time. The deploy workflow
         sets VITE_APP_NAME / VITE_APP_URL so the production build bakes in
         "Visual Field Check". React updates the document title after load. -->
    <title>%VITE_APP_NAME% — Free Visual Field Self-Test</title>

    <!-- Open Graph — WhatsApp, Slack, Twitter etc. scrape these for link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_APP_NAME% — Free Visual Field Self-Test" />
    <meta property="og:description" content="Free visual field self-test — Goldmann kinetic perimetry at home. Track your peripheral vision over time." />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%VITE_APP_NAME% — Free Visual Field Self-Test" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
